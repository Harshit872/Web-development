<html lang="en">

<head>

    <title>Display property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid blue;
            display: inline-block;
            width: 344px;
            padding: 45px;
            margin: 45px;

        }

        .box1{
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>

<body>

    </SPAN>

</body>

</html>
