<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video 5</title>
</head>
<body>
    <h1>Unordered list example</h1>
    <ul type = "circle">
        <li>Pen</li>
        <li>Pencil</li>
        <li>Eraser</li>
    </ul>
    <h1>Ordered List example</h1>
    <ol  type = "A">
        <li>Mango</li>
        <li>Lichi</li>    
        <li>Apple</li>
    </ol>

    <table border="3">
        <caption>
            Raunak ke Naukar
        </caption>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Alice</td>
                <td>Developer</td>
                <td>$810000</td>

            </tr>
            <tr>
                <td>2</td>
                <td>Lawda</td>
                <td>randibaj</td>
                <td>$8180000</td>

            </tr>
            <tr>
                <td>3</td>
                <td>Randwa</td>
                <td>radnor</td>
                <td>$89</td>

            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Total Rand </td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
