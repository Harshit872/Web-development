<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element sector */
        div{
            background-color: red;
        }
        /* Universal selector */
        *{
            margin:0;
            padding:0;
        }
        /* Pseudo selector */
        a:visited{
            color: yellow;
        }
    </style>
</head>
<body>
    <div>
        Hey am harshit
    </div>
    <a href="https://www.google.com">Go to google</a>
    
</body>
</html>
